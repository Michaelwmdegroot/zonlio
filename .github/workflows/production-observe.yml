name: Observe public Zonlio deployment
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Check application]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: zonlio-public-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Observe expected application and protected routes without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zonlio-public-observation
          passed=0
          for attempt in 1 2 3 4 5; do
            if node scripts/production-smoke.mjs > /tmp/zonlio-public-observation/observation.json; then
              passed=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          cat /tmp/zonlio-public-observation/observation.json
          if [ "$passed" -ne 1 ]; then
            echo '::error::Expected public release or route checks not verified. Read the sanitized report; do not infer a full outage or full release approval.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zonlio-public-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zonlio-public-observation/
          retention-days: 3
