name: Apply verified design review
on:
  push:
    branches: [feat/zonlio-design-system]
    paths: [.github/workflows/design-source.yml]
permissions:
  contents: write
jobs:
  design:
    if: github.ref == 'refs/heads/feat/zonlio-design-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/zonlio-design-system
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/zonlio-design-system"
          cat .design-transfer.1 .design-transfer.2 .design-transfer.3 .design-transfer.4 > /tmp/zonlio-design.patch.xz
          echo 'd42e03298d2cc38d7ac08e1834014e4122ee19d9f1b78affbe688aa0f76118c4  /tmp/zonlio-design.patch.xz' | sha256sum --check
          xz -dc /tmp/zonlio-design.patch.xz > /tmp/zonlio-design.patch
          git apply --check --unidiff-zero /tmp/zonlio-design.patch
          git apply --unidiff-zero /tmp/zonlio-design.patch
          rm .design-transfer.1 .design-transfer.2 .design-transfer.3 .design-transfer.4
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/design-preview.mjs
      - name: Commit only to isolated design branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(design): apply approved Zonlio Blue Glass brand and shared design system'
          git push origin HEAD:refs/heads/feat/zonlio-design-system
      - uses: actions/upload-artifact@v4
        with:
          name: zonlio-design-review
          path: .artifacts/design/
          retention-days: 7
