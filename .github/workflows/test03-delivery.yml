name: Verify test readiness before main publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/test03-delivery.yml]
permissions:
  contents: write
concurrency:
  group: zonlio-test03-delivery
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: zonlio-ci-root-only
          MYSQL_DATABASE: zonlio_ci_test
          MYSQL_USER: zonlio_ci
          MYSQL_PASSWORD: zonlio-ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pzonlio-ci-root-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply exact locally tested patch without changing workflow files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '7e49f1561b2138c2364ae7ac4c64909c0199f095'
          mkdir -p /tmp/zonlio-test03-evidence
          cat .test03-transfer.{1,2,3} > /tmp/zonlio-test03.patch.xz
          echo '3017a3937609d9f4bcde24ad338aafa651118b5ed288177e43ed0506d16b9563  /tmp/zonlio-test03.patch.xz' | sha256sum --check
          xz -dc /tmp/zonlio-test03.patch.xz > /tmp/zonlio-test03.patch
          echo '2204bce47b68461b8ba64616b5e3b5647a64c47d91194e9d64f1b2fe3391de71  /tmp/zonlio-test03.patch' | sha256sum --check
          git apply --check --unidiff-zero /tmp/zonlio-test03.patch
          git apply --unidiff-zero /tmp/zonlio-test03.patch
          git rm .test03-transfer.{1,2,3}
          git diff --check
          test -z "$(git diff --name-only -- .github)"
      - run: npm ci --ignore-scripts
      - name: Check and test actual release candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee /tmp/zonlio-test03-evidence/check.txt
          npm test | tee /tmp/zonlio-test03-evidence/tests.txt
      - name: Test real MySQL 8
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mysql.integration.test.mjs | tee /tmp/zonlio-test03-evidence/mysql.txt
        env:
          MYSQL_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: zonlio_ci_test
          DB_USER: zonlio_ci
          DB_PASSWORD: zonlio-ci-test-only
      - name: Build and audit
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee /tmp/zonlio-test03-evidence/build.txt
          npm audit --omit=dev --audit-level=high | tee /tmp/zonlio-test03-evidence/audit.txt
      - name: Publish tested application atomically without force push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add protected runtime readiness and owner acceptance checks'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > /tmp/zonlio-test03-evidence/COMMIT.txt
          git archive --format=tar HEAD -o /tmp/zonlio-test03-evidence/verified-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zonlio-test03-verification
          path: /tmp/zonlio-test03-evidence/
          retention-days: 3
