name: Verify and publish Mijn Zonlio on main
on:
  push:
    branches: [main]
    paths: [.github/workflows/growth02-delivery.yml]
permissions:
  contents: write
concurrency:
  group: zonlio-growth02-main-delivery
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: zonlio-ci-root-only
          MYSQL_DATABASE: zonlio_ci_test
          MYSQL_USER: zonlio_ci
          MYSQL_PASSWORD: zonlio-ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pzonlio-ci-root-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply only the verified source package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '800d8f84b4641c9f69f061e60bd68240098b0d99'
          mkdir -p .artifacts/growth02
          cat .growth02-transfer.{1,2,3,4,5,6,7} > /tmp/zonlio-growth02.patch.xz
          echo '165fe709c42b1f8e08d2ee67819d82e4fc3e28bac0d95711dfdf723038092fbf  /tmp/zonlio-growth02.patch.xz' | sha256sum --check
          xz -dc /tmp/zonlio-growth02.patch.xz > /tmp/zonlio-growth02.patch
          echo '826296c3d9e65633a08db84639cfa570659e73b6462927d210179ba7596bb2e7  /tmp/zonlio-growth02.patch' | sha256sum --check
          git apply --check --unidiff-zero /tmp/zonlio-growth02.patch
          git apply --unidiff-zero /tmp/zonlio-growth02.patch
          git rm .growth02-transfer.{1,2,3,4,5,6,7}
          git diff --check
          test -z "$(git diff --name-only -- .github)"
      - run: npm ci --ignore-scripts
      - name: Syntax and standard tests
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee .artifacts/growth02/check.txt
          npm test | tee .artifacts/growth02/tests.txt
      - name: Verify real MySQL 8 before publishing
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mysql.integration.test.mjs | tee .artifacts/growth02/mysql.txt
        env:
          MYSQL_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: zonlio_ci_test
          DB_USER: zonlio_ci
          DB_PASSWORD: zonlio-ci-test-only
      - name: Build and dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee .artifacts/growth02/build.txt
          npm audit --omit=dev --audit-level=high | tee .artifacts/growth02/audit.txt
      - name: Publish verified application atomically without force push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat > .artifacts/growth02/change.txt
          git commit -m 'feat: add Mijn Zonlio, confirmed dayplans and NIVO Portal handoff'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > .artifacts/growth02/COMMIT.txt
          git archive --format=tar HEAD -o .artifacts/growth02/verified-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zonlio-growth02-verification
          path: .artifacts/growth02/
          retention-days: 3
