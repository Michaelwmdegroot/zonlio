name: Observe Zonlio operations
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zonlio-operations-watch
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check public health and persistent cron heartbeat
        shell: bash
        run: |
          if node scripts/operations-watchdog.mjs; then
            exit 0
          fi
          sleep 15
          node scripts/operations-watchdog.mjs
